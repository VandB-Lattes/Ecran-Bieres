name: Catalogue V and B

on:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi vers 6h (heure de Paris)
  workflow_dispatch: {}    # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lire le catalogue sur vandb.fr
        run: node scripts/scrape-vandb.mjs
      - name: Enregistrer si le catalogue a changé
        run: |
          git config user.name "catalogue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalogue.json
          if git diff --cached --quiet; then
            echo "Catalogue inchangé."
          else
            git commit -m "Catalogue V and B mis à jour"
            git pull --rebase
            git push
          fi
